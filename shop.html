<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كل المنتجات | iLOCK</title>
<meta name="description" content="كل منتجات iLOCK: مشتركات، شواحن وكابلات، وصلات وبكرات، إضاءة LED وإكسسوارات، بالأسعار والمواصفات.">
<meta name="theme-color" content="#1B1319">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="shop">
<div id="site-header"></div>

<main>
  <div class="phead"><div class="wrap">
    <nav class="crumbs" aria-label="مسار الصفحة"><a href="index.html">الرئيسية</a><span aria-hidden="true">/</span><span id="crumb">كل المنتجات</span></nav>
    <h1 id="title">كل المنتجات</h1>
    <p id="subtitle">مشتركات، شواحن، وصلات، إضاءة وإكسسوارات. كل الأسعار بالجنيه المصري.</p>
  </div></div>

  <div class="wrap shop">
    <aside class="filters" id="filters" aria-label="الفلاتر">
      <div class="fclose" style="display:none;justify-content:space-between;align-items:center">
        <h2 style="font-size:20px">الفلاتر</h2>
        <button class="icon-btn" type="button" id="fclose" aria-label="قفل الفلاتر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="fgroup"><h3>القسم</h3><div class="fopts" id="fGroups"></div></div>
      <div class="fgroup"><h3>النوع</h3><div class="fopts" id="fTags"></div></div>
      <div class="fgroup"><h3>السعر (ج.م)</h3>
        <div class="prange"><input id="pmin" type="number" inputmode="numeric" placeholder="من" aria-label="أقل سعر"><input id="pmax" type="number" inputmode="numeric" placeholder="لحد" aria-label="أعلى سعر"></div>
      </div>
      <div class="fgroup">
        <label class="switch" for="fStock">المتوفر بس<input type="checkbox" id="fStock" checked></label>
        <label class="switch" for="fSale">العروض بس<input type="checkbox" id="fSale"></label>
      </div>
      <button class="btn btn-line btn-sm" type="button" id="freset">امسح كل الفلاتر</button>
      <button class="btn btn-ink fclose" type="button" id="fapply" style="display:none;position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:20px">اعرض النتايج</button>
    </aside>

    <section aria-label="المنتجات">
      <div class="toolbar">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn btn-line btn-sm fbtn" type="button" id="fopen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>فلاتر</button>
          <span class="count" id="count"></span>
          <div class="chips" id="chips"></div>
        </div>
        <label><span class="sr">ترتيب</span>
          <select class="sel" id="sort">
            <option value="rel">الترتيب: المقترح</option>
            <option value="asc">السعر: من الأقل</option>
            <option value="desc">السعر: من الأعلى</option>
            <option value="new">الأحدث</option>
          </select>
        </label>
      </div>
      <div class="grid shopgrid" id="grid"></div>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<script src="assets/data/products.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
